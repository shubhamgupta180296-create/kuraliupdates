<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>KuraliUpdates Admin</title><link rel="stylesheet" href="../app.css"></head><body><main class="section"><div class="wrap"><h1>Admin Dashboard</h1><p>Admin-only operations. Use after creating your first admin account.</p><button id="load" class="btn primary">Load dashboard</button><div id="out"></div></div></main><script>
async function a(p,o={}){let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}
document.querySelector("#load").onclick=async()=>{try{let d=await a("/admin/dashboard");document.querySelector("#out").innerHTML=`<div class="card"><h2>Sellers (${d.sellers.length})</h2>${d.sellers.map(x=>`<p><b>${x.business_name}</b> — ${x.status} <button onclick="act('seller',${x.id},'approved')">Approve</button> <button onclick="act('seller',${x.id},'rejected')">Reject</button></p>`).join("")}<h2>Products (${d.products.length})</h2>${d.products.map(x=>`<p>${x.name} — ${x.status} <button onclick="act('product',${x.id},'approved')">Approve</button></p>`).join("")}<h2>Complaints (${d.complaints.length})</h2>${d.complaints.map(x=>`<p>${x.complaint_no} — ${x.status} <button onclick="act('complaint',${x.id},'in_progress')">In progress</button> <button onclick="act('complaint',${x.id},'resolved')">Resolved</button></p>`).join("")}</div>`}catch(e){document.querySelector("#out").textContent="✕ "+e.message}};
async function act(type,id,status){await a("/admin/action",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({type,id,status})});document.querySelector("#load").click()}
</script></body></html>
